[phases.setup]
nixPkgs = ["chromium", "nodejs", "nss", "alsa-lib", "atk", "at-spi2-atk", "cups", "libdrm", "libxkbcommon", "mesa", "pango", "cairo"]

[phases.build]
cmds = ["npm install", "npm run build", "cd backend && npm install", "cd backend && npx puppeteer browsers install chrome"]

[start]
cmd = "cd backend && node src/server.js"
