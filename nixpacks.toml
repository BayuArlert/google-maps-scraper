[phases.setup]
nixPkgs = [
  "nodejs_20",
  "chromium",
  "nss",
  "alsa-lib",
  "atk",
  "at-spi2-atk",
  "cups",
  "libdrm",
  "libxkbcommon",
  "mesa",
  "pango",
  "cairo",
  "libXcomposite",
  "libXdamage",
  "libXext",
  "libXfixes",
  "libXrandr",
  "libxcb",
  "libxshmfence",
  "glib",
  "nspr",
  "dbus",
  "expat",
  "xorg.libX11",
  "xorg.libXcursor",
  "xorg.libXi"
]

[phases.build]
cmds = [
  "npm install",
  "npm run build",
  "cd backend && PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm install"
]

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
NODE_ENV = "production"

[start]
cmd = "cd backend && node src/server.js"
